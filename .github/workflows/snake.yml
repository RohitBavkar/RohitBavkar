name: Generate contribution card

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/snake.yml
      - assets/src/**

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake from the contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # dots: empty cell, then four activity levels (orange profile theme)
          outputs: |
            dist/snake-dark.svg?color_snake=#fb923c&color_dots=#1e1e23,#4a2410,#8a3a10,#d4570f,#f97316

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wrap the snake in the Contribution activity card
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist   # snk's container writes dist/ as root
          pip install --quiet fonttools brotli
          python3 assets/src/build.py --activity dist/snake-dark.svg dist/activity.svg

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
