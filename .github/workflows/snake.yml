name: Generate contribution snake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs from the contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # dots: empty cell, then four activity levels (orange profile theme)
          outputs: |
            dist/snake-dark.svg?color_snake=#fb923c&color_dots=#1e1e23,#4a2410,#8a3a10,#d4570f,#f97316
            dist/snake-light.svg?color_snake=#ea580c&color_dots=#ebedf0,#fed7aa,#fdba74,#fb923c,#ea580c

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
